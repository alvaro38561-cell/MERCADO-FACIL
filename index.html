<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MercadoFácil - Calculadora de Compras</title>
  <!-- Librería OCR para reconocimiento de texto local -->
  <script src="./tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding: 15px; padding-bottom: 50px; color: #333; position: relative; min-height: 100vh; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2 { font-size: 1.1rem; margin-bottom: 10px; color: #1a252c; }
    
    .currency-selector { display: flex; gap: 10px; margin-bottom: 10px; }
    select, input { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    select { background: #fff; font-weight: bold; }
    input { width: 100%; }

    .total-display { font-size: 1.8rem; font-weight: bold; text-align: center; margin: 10px 0; color: #2e7d32; }
    .progress-bar { width: 100%; height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #2e7d32; transition: width 0.3s, background 0.3s; }
    
    /* Visor de cámara con recuadro objetivo */
    #video-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .scan-target { position: absolute; width: 70%; height: 35%; border: 2px dashed #007bff; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); pointer-events: none; }

    .btn { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #007bff; color: white; }
    .btn-scan { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    
    ul { list-style: none; max-height: 150px; overflow-y: auto; margin-top: 10px; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .btn-delete-item { background: transparent; border: none; color: #dc3545; font-weight: bold; cursor: pointer; font-size: 1.1rem; padding: 2px 8px; margin-left: 10px; }
    .status-text { text-align: center; font-size: 0.85rem; color: #666; margin-top: 5px; font-weight: 500; }

    /* Estilo de la Firma de Autoría en la esquina inferior derecha */
    .author-signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #64748b;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      backdrop-filter: blur(4px);
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Control de Moneda y Presupuesto -->
  <div class="card">
    <h2>Moneda y Presupuesto Límite</h2>
    <div class="currency-selector">
      <select id="monedaSelect" onchange="actualizarPresupuesto()">
        <option value="Bs.">VES (Bs.)</option>
        <option value="$" selected>USD ($)</option>
        <option value="€">EUR (€)</option>
      </select>
      <input type="number" id="limiteInput" value="100" step="0.01" oninput="actualizarPresupuesto()" placeholder="Límite">
    </div>
    <div class="total-display" id="totalDisplay">$0,00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Visor de Cámara con Marco de Enfoque -->
  <div class="card">
    <h2>Escáner Rápido (Formato 1.000,00)</h2>
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
      <div class="scan-target"></div>
    </div>
    <button class="btn btn-scan" onclick="escanearPrecio()">⚡ Escanear Precio Enfocado</button>
    <p class="status-text" id="statusText">Inicializando motor de lectura...</p>
  </div>

  <!-- Ingreso Manual e Historial -->
  <div class="card">
    <h2>Ingreso Manual</h2>
    <input type="text" id="montoManual" placeholder="Ej: 1.050,50 o 1050,50" inputmode="decimal">
    <button class="btn btn-primary" onclick="agregarManual()">＋ Agregar al Total</button>

    <h2 style="margin-top: 20px;">Historial de Productos</h2>
    <ul id="listaHistorial"></ul>
    <button class="btn btn-danger" onclick="reiniciarTodo()" style="margin-top: 15px;">Reiniciar Todo</button>
  </div>

  <!-- Firma de Autoría -->
  <div class="author-signature">
    App creada por Alvaro Briceño
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let totalAcumulado = 0;
    let historialPrecios = [];
    let video = document.getElementById('webcam');
    let statusText = document.getElementById('statusText');
    let ocrWorker = null;

    // --- FUNCIONES DE FORMATEO (LÓGICA PRINCIPAL) ---

    function limpiarMontoOCR(textoRaw) {
      let textoLimpio = textoRaw.replace(/[^\d\.,]/g, '');
      if (!textoLimpio) return null;

      const numeroComas = (textoLimpio.match(/,/g) || []).length;
      const numeroPuntos = (textoLimpio.match(/\./g) || []).length;

      if (numeroPuntos >= 0 && numeroComas === 1) {
        let sinMiles = textoLimpio.replace(/\./g, '');
        let formatoJS = sinMiles.replace(',', '.');
        return parseFloat(formatoJS);
      }

      if (numeroComas === 0 && numeroPuntos > 0) {
        let posicionUltimoPunto = textoLimpio.lastIndexOf('.');
        let parteEntera = textoLimpio.substring(0, posicionUltimoPunto).replace(/\./g, '');
        let parteDecimal = textoLimpio.substring(posicionUltimoPunto + 1);
        let formatoJS = parteEntera + '.' + parteDecimal;
        return parseFloat(formatoJS);
      }

      if (numeroComas === 0 && numeroPuntos === 0) {
        return parseFloat(textoLimpio);
      }

      return null;
    }

    function formatearVisual(monto) {
      if (isNaN(monto)) return "0,00";
      return monto.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // --- INICIALIZACIÓN ---

    async function initOCR() {
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        statusText.innerText = "Cámara y escáner listos";
      } catch (e) {
        statusText.innerText = "Error cargando módulo OCR";
      }
    }
    initOCR();

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { statusText.innerText = "Error al acceder a la cámara"; });

    // --- LÓGICA DE LA APLICACIÓN ---

    function obtenerSimboloMoneda() {
      return document.getElementById('monedaSelect').value;
    }

    function agregarMonto(monto) {
      if (isNaN(monto) || monto <= 0) return;
      totalAcumulado += monto;
      historialPrecios.unshift(monto);
      renderHistorial();
      actualizarPresupuesto();
    }

    function renderHistorial() {
      let lista = document.getElementById('listaHistorial');
      let sim = obtenerSimboloMoneda();
      lista.innerHTML = '';
      historialPrecios.forEach((monto, index) => {
        let li = document.createElement('li');
        li.innerHTML = `
          <span>Producto</span>
          <div>
            <strong>+${sim}${formatearVisual(monto)}</strong>
            <button class="btn-delete-item" onclick="eliminarPrecio(${index})" title="Eliminar este producto">❌</button>
          </div>
        `;
        lista.appendChild(li);
      });
    }

    function eliminarPrecio(index) {
      if (index >= 0 && index < historialPrecios.length) {
        totalAcumulado -= historialPrecios[index];
        if (totalAcumulado < 0) totalAcumulado = 0;
        historialPrecios.splice(index, 1);
        renderHistorial();
        actualizarPresupuesto();
      }
    }

    function agregarManual() {
      let input = document.getElementById('montoManual');
      let monto = limpiarMontoOCR(input.value); 
      
      if (monto && monto > 0) {
        agregarMonto(monto);
        input.value = '';
      } else {
        alert("Formato de número manual inválido. Use 1.000,00 o 1000,00");
      }
    }

    function actualizarPresupuesto() {
      let limiteInput = document.getElementById('limiteInput').value;
      let limite = parseFloat(limiteInput) || 0; 

      let totalEl = document.getElementById('totalDisplay');
      let fillEl = document.getElementById('progressFill');
      let sim = obtenerSimboloMoneda();

      totalEl.innerText = `${sim}${formatearVisual(totalAcumulado)}`;

      let porcentaje = limite > 0 ? (totalAcumulado / limite) * 100 : 0;
      fillEl.style.width = `${Math.min(porcentaje, 100)}%`;

      if (totalAcumulado > limite && limite > 0) {
        totalEl.style.color = '#dc3545';
        fillEl.style.background = '#dc3545';
        alert(`⚠️ ¡Has superado tu presupuesto límite de ${sim}${formatearVisual(limite)}!`);
      } else if (porcentaje >= 85) {
        totalEl.style.color = '#ffc107';
        fillEl.style.background = '#ffc107';
      } else {
        totalEl.style.color = '#2e7d32';
        fillEl.style.background = '#2e7d32';
      }
    }

    async function escanearPrecio() {
      if (!ocrWorker) {
        statusText.innerText = "Aún cargando escáner, espera un momento...";
        return;
      }

      let canvas = document.getElementById('canvas');
      let context = canvas.getContext('2d');

      let cropW = video.videoWidth * 0.70;
      let cropH = video.videoHeight * 0.35;
      let startX = (video.videoWidth - cropW) / 2;
      let startY = (video.videoHeight - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      context.drawImage(video, startX, startY, cropW, cropH, 0, 0, cropW, cropH);

      statusText.innerText = "Escaneando...";

      try {
        const ret = await ocrWorker.recognize(canvas);
        const textRaw = ret.data.text;

        const matches = textRaw.match(/[\d\.,]+/g);
        let montoDetectadoValido = null;

        if (matches && matches.length > 0) {
          for (let match of matches) {
            let monto = limpiarMontoOCR(match);
            if (monto && monto > 0 && monto < 100000000) {
              montoDetectadoValido = monto;
              break;
            }
          }
        }

        if (montoDetectadoValido) {
          statusText.innerText = `Detectado: ${obtenerSimboloMoneda()}${formatearVisual(montoDetectadoValido)}`;
          agregarMonto(montoDetectadoValido);
        } else {
          statusText.innerText = "No se detectó un precio claro (Formato: 1.000,00).";
        }
      } catch (e) {
        statusText.innerText = "Error en la lectura.";
      }
    }

    function reiniciarTodo() {
      totalAcumulado = 0;
      historialPrecios = [];
      renderHistorial();
      actualizarPresupuesto();
      statusText.innerText = "Cámara y escáner listos";
    }

    // Registrar Service Worker para funcionamiento Offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('App lista para uso Offline'))
          .catch(err => console.log('Error instalando modo offline', err));
      });
    }
  </script>
</body>
</html>

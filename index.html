<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MercadoFácil - Calculadora de Compras</title>
  <!-- Librería OCR para reconocer texto en imágenes -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding: 15px; color: #333; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2 { font-size: 1.1rem; margin-bottom: 10px; color: #1a252c; }
    input { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; margin-top: 5px; }
    .total-display { font-size: 1.8rem; font-weight: bold; text-align: center; margin: 10px 0; color: #2e7d32; }
    .progress-bar { width: 100%; height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #2e7d32; transition: width 0.3s, background 0.3s; }
    #video-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .btn { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #007bff; color: white; }
    .btn-scan { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    ul { list-style: none; max-height: 150px; overflow-y: auto; margin-top: 10px; }
    li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .status-text { text-align: center; font-size: 0.85rem; color: #666; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- Control de Presupuesto -->
  <div class="card">
    <h2>Límite de Presupuesto ($)</h2>
    <input type="number" id="limiteInput" value="100" step="0.01" oninput="actualizarPresupuesto()">
    <div class="total-display" id="totalDisplay">$0.00</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Visor de Cámara y Escáner OCR -->
  <div class="card">
    <h2>Escáner de Precios</h2>
    <div id="video-container">
      <video id="webcam" autoplay playsinline></video>
    </div>
    <button class="btn btn-scan" onclick="escanearPrecio()">📷 Capturar y Escanear Precio</button>
    <p class="status-text" id="statusText">Cámara lista</p>
  </div>

  <!-- Entrada Manual y Historial -->
  <div class="card">
    <h2>Ingreso Manual</h2>
    <input type="number" id="montoManual" placeholder="Ej: 5.50" step="0.01">
    <button class="btn btn-primary" onclick="agregarManual()">＋ Agregar al Total</button>

    <h2 style="margin-top: 20px;">Historial de Productos</h2>
    <ul id="listaHistorial"></ul>
    <button class="btn btn-danger" onclick="reiniciarTodo()" style="margin-top: 15px;">Reiniciar Todo</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let totalAcumulado = 0;
    let video = document.getElementById('webcam');
    let statusText = document.getElementById('statusText');

    // Inicializar Cámara del teléfono
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => { statusText.innerText = "Error al acceder a la cámara"; });

    function agregarMonto(monto) {
      totalAcumulado += monto;
      let lista = document.getElementById('listaHistorial');
      let li = document.createElement('li');
      li.innerHTML = `<span>Producto</span> <strong>+$${monto.toFixed(2)}</strong>`;
      lista.prepend(li);
      actualizarPresupuesto();
    }

    function agregarManual() {
      let input = document.getElementById('montoManual');
      let monto = parseFloat(input.value);
      if (!isNaN(monto) && monto > 0) {
        agregarMonto(monto);
        input.value = '';
      }
    }

    function actualizarPresupuesto() {
      let limite = parseFloat(document.getElementById('limiteInput').value) || 0;
      let totalEl = document.getElementById('totalDisplay');
      let fillEl = document.getElementById('progressFill');

      totalEl.innerText = `$${totalAcumulado.toFixed(2)}`;
      let porcentaje = limite > 0 ? (totalAcumulado / limite) * 100 : 0;
      fillEl.style.width = `${Math.min(porcentaje, 100)}%`;

      if (totalAcumulado > limite && limite > 0) {
        totalEl.style.color = '#dc3545';
        fillEl.style.background = '#dc3545';
        alert('⚠️ ¡Has superado tu presupuesto límite!');
      } else if (porcentaje >= 85) {
        totalEl.style.color = '#ffc107';
        fillEl.style.background = '#ffc107';
      } else {
        totalEl.style.color = '#2e7d32';
        fillEl.style.background = '#2e7d32';
      }
    }

    async function escanearPrecio() {
      let canvas = document.getElementById('canvas');
      let context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      statusText.innerText = "Procesando imagen...";

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(canvas);
        await worker.terminate();

        // Buscar números decimales en el texto detectado
        const matches = ret.data.text.match(/\d+[\.,]\d{2}/g);
        if (matches && matches.length > 0) {
          let precioDetectado = parseFloat(matches[0].replace(',', '.'));
          statusText.innerText = `Detectado: $${precioDetectado.toFixed(2)}`;
          agregarMonto(precioDetectado);
        } else {
          statusText.innerText = "No se detectó un precio claro. Intenta de nuevo.";
        }
      } catch (e) {
        statusText.innerText = "Error en el escáner OCR.";
      }
    }

    function reiniciarTodo() {
      totalAcumulado = 0;
      document.getElementById('listaHistorial').innerHTML = '';
      actualizarPresupuesto();
      statusText.innerText = "Cámara lista";
    }
  </script>
</body>
</html>
